name: Application CI

## Continuous integration for the Oriel Node.js/React application (application/frontend, application/backend).
##
## Stages (job ids in brackets), in the order they run:
##   1. Preflight        [preflight]              repository prerequisites; optional infrastructure-check settings
##   2. Quality + build  [frontend-ci, backend-ci] tests, type checks, production builds (parallel with 3)
##   3. Security         [dependency-audit]       npm audit of the production dependencies (parallel with 2)
##   4. Infrastructure   [infrastructure-check]   OPTIONAL, manual only (input check_infrastructure): read-only
##                       check that the deployed Auto Scaling Groups are in service and healthy
##   5. Summary          [ci-summary]             always runs; one verdict and a results table
##
## There are NO deploy, backend-verification, frontend-deployment or smoke-test stages, on purpose: the
## Terraform resources define no way to deliver code to the private instances (no artifact bucket, SSM or
## CodeDeploy; see docs/runbooks/application-deployment.md), and the application has no reachable URL yet.
## Adding those jobs now would be placeholders that report a deployment that did not happen.
## Terraform deployment lives in the separate terraform.yml; an application push never runs terraform apply.
##
## Actions are pinned to full commit SHAs (the comment gives the release). There is no linter or formatter
## configured in the applications, so there is no lint stage; the type checks run as part of the build.
on:
  pull_request:
    paths:
      - "application/**"
      - ".github/workflows/application.yml"
  push:
    branches: [main, master]
    paths:
      - "application/**"
      - ".github/workflows/application.yml"
  workflow_dispatch:
    inputs:
      check_infrastructure:
        description: "Also check that the deployed Auto Scaling Groups are in service and healthy (read-only AWS access)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: application-${{ github.event_name == 'workflow_dispatch' && 'manual' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

## Fail fast inside every script step (errexit and pipefail).
defaults:
  run:
    shell: bash

jobs:
  ## Cheap checks first, so a missing file or setting fails the run in seconds instead of after the builds.
  ## Only the NAMES of missing settings are printed, never values.
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "1. Start the run summary"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          CHECK_INFRA: ${{ github.event_name == 'workflow_dispatch' && inputs.check_infrastructure }}
        run: |
          {
            echo "## Application CI"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Branch / ref | \`${REF_NAME}\` |"
            echo "| Event | ${EVENT} (started by ${ACTOR}) |"
            echo "| Infrastructure check | $([ "$CHECK_INFRA" = "true" ] && echo requested || echo "not requested") |"
            echo "| Run | ${RUN_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "2. Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "3. Check the application prerequisites"
        run: |
          missing=()
          for app in frontend backend; do
            for f in package.json package-lock.json .nvmrc; do
              [ -f "application/${app}/${f}" ] || missing+=("application/${app}/${f}")
            done
            if [ -f "application/${app}/package.json" ]; then
              for script in test typecheck build; do
                node -e 'const s = require(process.argv[1]).scripts || {}; process.exit(s[process.argv[2]] ? 0 : 1)' \
                  "./application/${app}/package.json" "$script" || missing+=("npm script '${script}' in application/${app}/package.json")
              done
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Preflight failed::Missing: ${missing[*]}"
            exit 1
          fi
          echo "Both applications have a package.json, a lockfile, an .nvmrc and the test, typecheck and build scripts."

      - name: "4. Check the infrastructure-check configuration (only if requested)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_infrastructure }}
        env:
          HAS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_REGION: ${{ vars.AWS_REGION != '' }}
          HAS_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET != '' }}
          HAS_STATE_REGION: ${{ vars.TF_STATE_REGION != '' }}
        run: |
          missing=()
          [ "$HAS_ACCESS_KEY" = "true" ] || missing+=("secret AWS_ACCESS_KEY_ID")
          [ "$HAS_SECRET_KEY" = "true" ] || missing+=("secret AWS_SECRET_ACCESS_KEY")
          [ "$HAS_REGION" = "true" ] || missing+=("variable AWS_REGION")
          [ "$HAS_STATE_BUCKET" = "true" ] || missing+=("variable TF_STATE_BUCKET")
          [ "$HAS_STATE_REGION" = "true" ] || missing+=("variable TF_STATE_REGION")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing configuration::Not set: ${missing[*]}. See docs/runbooks/ci-cd.md and bootstrap/README.md."
            exit 1
          fi
          echo "All required secrets and variables are set (values not shown)."

  frontend-ci:
    name: "Frontend CI (test, build)"
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: application/frontend
    steps:
      - name: "1. Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "2. Set up Node.js (version from application/frontend/.nvmrc)"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: application/frontend/.nvmrc
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json

      - name: "3. Show tool versions"
        run: |
          echo "node $(node --version), npm $(npm --version)"

      ## Dependency vulnerabilities are reported by the dependency-audit job, not on every install.
      - name: "4. Install dependencies (npm ci, lockfile only)"
        run: npm ci --no-audit --no-fund

      - name: "5. Run frontend tests"
        run: npm test

      - name: "6. Production build (type check + bundle)"
        run: npm run build

      - name: "7. Verify the build output exists"
        run: |
          if [ ! -f dist/index.html ] || [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error title=Frontend build output missing::application/frontend/dist/index.html or dist/assets is missing or empty after 'npm run build'."
            exit 1
          fi
          echo "Build output: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      ## Nothing deploys this output yet, so it is kept only for runs that are not pull requests, and briefly.
      - name: "8. Upload the frontend build artifact"
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: application/frontend/dist
          retention-days: 3
          if-no-files-found: error

  backend-ci:
    name: "Backend CI (MySQL 8, type check, test, build)"
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: application/backend
    ## A throwaway database for the MySQL store contract tests; it exists only for this job and uses an
    ## empty root password because nothing outside the job can reach it.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: oriel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: ""
      MYSQL_TEST_DATABASE: oriel_test
    steps:
      - name: "1. Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "2. Set up Node.js (version from application/backend/.nvmrc)"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: application/backend/.nvmrc
          cache: npm
          cache-dependency-path: application/backend/package-lock.json

      - name: "3. Show tool versions"
        run: |
          echo "node $(node --version), npm $(npm --version)"

      - name: "4. Confirm the MySQL service is reachable"
        run: |
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then
              echo "MySQL is accepting connections on 127.0.0.1:3306 (attempt ${attempt})"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=MySQL service not reachable::The mysql:8.0 service container did not accept connections on 127.0.0.1:3306 within 60 seconds. Check the 'Initialize containers' step of this job."
          exit 1

      - name: "5. Install dependencies (npm ci, lockfile only)"
        run: npm ci --no-audit --no-fund

      - name: "6. Type check"
        run: npm run typecheck

      ## The JSON report is written next to the console output so the next step can prove that the MySQL
      ## contract tests really ran instead of being skipped.
      - name: "7. Run backend tests (including MySQL contract tests)"
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results.json

      ## Fail-closed guard. It requires that the MySQL contract tests exist, all passed, and nothing was
      ## skipped. Note: when MySQL is unreachable the tests are reported as "skipped" together with a failed
      ## suite, so the failed-suite check is part of the guard, not only the skipped count.
      - name: "8. Verify the MySQL contract tests actually ran and passed"
        run: |
          node -e '
            const r = require("./test-results.json");
            const all = r.testResults.flatMap((f) => f.assertionResults);
            const mysql = all.filter((a) => a.ancestorTitles.some((t) => t.includes("MysqlStore")));
            const mysqlPassed = mysql.filter((a) => a.status === "passed").length;
            console.log(`total=${r.numTotalTests} passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${r.numPendingTests} failedSuites=${r.numFailedTestSuites} mysqlContract=${mysqlPassed}/${mysql.length}`);
            const problems = [];
            if (!r.success || r.numFailedTestSuites > 0) problems.push("the test run did not succeed (a failed test or suite, for example the MySQL setup in beforeAll)");
            if (mysql.length === 0) problems.push("no MySQL contract tests were found in the report (renamed or removed?)");
            if (mysqlPassed !== mysql.length) problems.push((mysql.length - mysqlPassed) + " MySQL contract test(s) did not pass");
            if (r.numPendingTests > 0) problems.push(r.numPendingTests + " test(s) were skipped (MYSQL_TEST_* unset or invalid, or a skipped/todo test)");
            if (problems.length > 0) {
              console.log("::error title=Backend test guard failed::" + problems.join("; "));
              process.exit(1);
            }
          '

      - name: "9. Add the test results to the job summary"
        if: ${{ always() }}
        run: |
          if [ -f test-results.json ]; then
            node -e '
              const r = require("./test-results.json");
              const mysql = r.testResults.flatMap((f) => f.assertionResults).filter((a) => a.ancestorTitles.some((t) => t.includes("MysqlStore")));
              const row = [r.numTotalTests, r.numPassedTests, r.numFailedTests, r.numFailedTestSuites, r.numPendingTests, mysql.filter((a) => a.status === "passed").length + "/" + mysql.length];
              console.log("### Backend tests\n\n| Total | Passed | Failed tests | Failed suites | Skipped | MySQL contract passed |\n| --- | --- | --- | --- | --- | --- |\n| " + row.join(" | ") + " |");
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report was produced (the test step did not finish)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "10. Production build"
        run: npm run build

      - name: "11. Verify the build output exists"
        run: |
          missing=0
          for f in dist/server.js dist/db/migrate.js dist/db/migrations/001_init.sql; do
            if [ ! -f "$f" ]; then
              echo "::error title=Backend build output missing::application/backend/$f was not produced by 'npm run build'."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "Build output: $(find dist -type f | wc -l) files"

      ## Nothing deploys this output yet, so it is kept only for runs that are not pull requests, and briefly.
      - name: "12. Upload the backend build artifact"
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            application/backend/dist
            application/backend/package.json
            application/backend/package-lock.json
          retention-days: 3
          if-no-files-found: error

  ## Reads only the lockfiles (no install) and asks the npm registry about known vulnerabilities in the
  ## production dependencies. High and critical advisories fail the run; lower ones are listed but allowed.
  ## A new advisory can fail an unchanged commit: update the dependency (or review the advisory) to fix it.
  dependency-audit:
    name: "Security: dependency audit (production)"
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "1. Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "2. Set up Node.js (version from application/backend/.nvmrc)"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: application/backend/.nvmrc

      - name: "3. Audit the production dependencies of both applications"
        run: |
          failed=0
          {
            echo "### Dependency audit (production dependencies, fails on high or critical)"
            echo
            echo "| Application | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for app in backend frontend; do
            echo "::group::npm audit (application/${app})"
            if (cd "application/${app}" && npm audit --package-lock-only --omit=dev --audit-level=high --fetch-retries=3); then
              result="no high or critical advisories"
            else
              result="FAILED (high/critical advisory, or the registry could not be reached)"
              echo "::error title=Dependency audit failed (${app})::npm audit reported high or critical advisories for application/${app}, or could not reach the registry. See the log above."
              failed=1
            fi
            echo "::endgroup::"
            echo "| ${app} | ${result} |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$failed" -eq 0 ]

  ## Optional and read-only. Skipped (not failed) unless the manual input is enabled; its settings were already
  ## checked by the preflight job. Requires the remote state and the AWS access keys in the repository secrets
  ## AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY (see docs/runbooks/ci-cd.md). No GitHub Environment is used, so
  ## these are the same repository-level keys as the Terraform plan identity. Only reads: terraform init
  ## (backend read), terraform output, and autoscaling:DescribeAutoScalingGroups. It is a health gate for a
  ## future deploy stage and a diagnostic today; it changes nothing.
  infrastructure-check:
    name: "Infrastructure check (optional, read-only)"
    needs: [frontend-ci, backend-ci]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_infrastructure }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "1. Check out the repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "2. Set up Terraform"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: "3. Configure AWS credentials (access keys, read-only use)"
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: "4. Confirm AWS accepts the credentials (identity is not printed)"
        run: |
          if aws sts get-caller-identity --query Account --output text > /dev/null 2>&1; then
            echo "AWS accepted the credentials."
          else
            echo "::error title=AWS rejected the credentials::Check that the access keys are active and belong to the intended IAM user."
            exit 1
          fi

      - name: "5. Initialise the S3 backend (read-only use)"
        working-directory: environments/dev
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          cp backend.tf.example backend.tf
          if ! terraform init -input=false \
              -backend-config="bucket=${STATE_BUCKET}" \
              -backend-config="region=${STATE_REGION}"; then
            echo "::error title=Backend initialisation failed::Check that the state bucket exists, TF_STATE_REGION matches its region, and the IAM user may read it (bootstrap/README.md)."
            exit 1
          fi

      ## Uses the real Terraform outputs frontend_asg_name and backend_asg_name. The ASGs use ELB health
      ## checks, so an instance reported Healthy here has passed its load balancer health check. Diagnostics:
      ## the target groups and the ASG activity history in the EC2 console, and the CloudWatch alarms.
      - name: "6. Verify both Auto Scaling Groups are in service and healthy"
        working-directory: environments/dev
        run: |
          failed=0
          {
            echo "### Infrastructure check (read-only)"
            echo
            echo "| Auto Scaling Group output | In service and healthy | Total |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for output in frontend_asg_name backend_asg_name; do
            if ! ASG="$(terraform output -raw "$output" 2>/dev/null)" || [ -z "$ASG" ]; then
              echo "::error title=Terraform output missing::Output '${output}' is not in the remote state. Has the dev stack been applied?"
              echo "| ${output} | output missing | |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            TOTAL="$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG" \
              --query 'length(AutoScalingGroups[0].Instances)' --output text)"
            HEALTHY="$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG" \
              --query 'length(AutoScalingGroups[0].Instances[?LifecycleState==`InService` && HealthStatus==`Healthy`])' \
              --output text)"
            echo "${output}: ${HEALTHY}/${TOTAL} instance(s) in service and healthy"
            echo "| ${output} | ${HEALTHY} | ${TOTAL} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$TOTAL" = "None" ] || [ "$TOTAL" -lt 1 ] || [ "$HEALTHY" != "$TOTAL" ]; then
              echo "::error title=Auto Scaling Group not healthy::${output} has ${HEALTHY}/${TOTAL} healthy in-service instances."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

  ## Always runs, so the run has one clear verdict. Preflight, frontend, backend and the dependency audit
  ## are required; the optional infrastructure check may be skipped but must not have failed or been cancelled.
  ci-summary:
    name: CI Summary
    needs: [preflight, frontend-ci, backend-ci, dependency-audit, infrastructure-check]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: "Report results and fail if required CI did not pass"
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FRONTEND_RESULT: ${{ needs.frontend-ci.result }}
          BACKEND_RESULT: ${{ needs.backend-ci.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          INFRA_RESULT: ${{ needs.infrastructure-check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## CI Summary"
            echo
            echo "| Stage | Job | Result | Required |"
            echo "| --- | --- | --- | --- |"
            echo "| Preflight | Preflight | ${PREFLIGHT_RESULT} | yes |"
            echo "| Quality + build | Frontend CI | ${FRONTEND_RESULT} | yes |"
            echo "| Quality + build | Backend CI | ${BACKEND_RESULT} | yes |"
            echo "| Security | Dependency audit | ${AUDIT_RESULT} | yes |"
            echo "| Infrastructure | Infrastructure check | ${INFRA_RESULT} | no (optional, manual) |"
            echo
            echo "Commit \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`. **Nothing was deployed** (application deployment is not implemented, see \`docs/runbooks/application-deployment.md\`), so there is no application URL and no deployment health check or smoke test. Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for entry in "Preflight:${PREFLIGHT_RESULT}" "Frontend CI:${FRONTEND_RESULT}" "Backend CI:${BACKEND_RESULT}" "Dependency audit:${AUDIT_RESULT}"; do
            name="${entry%%:*}"; result="${entry#*:}"
            ## When Preflight failed the other jobs were skipped on purpose: report only the root cause.
            if [ "$result" = "skipped" ] && [ "$PREFLIGHT_RESULT" != "success" ]; then
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error title=${name} did not pass::Result: ${result}. Open the '${name}' job to see the failed step (a skipped job means an earlier required job failed)."
              failed=1
            fi
          done
          case "$INFRA_RESULT" in
            success|skipped) ;;
            *)
              echo "::error title=Infrastructure check did not pass::Result: ${INFRA_RESULT}. Open the 'Infrastructure check' job to see the failed step."
              failed=1
              ;;
          esac
          if [ "$failed" -ne 0 ]; then
            echo "CI failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All required CI jobs passed."
