name: Terraform

## Pull requests and pushes run one offline job, "offline-validate" (no AWS credentials, no backend).
## Infrastructure deployment is manual (workflow_dispatch) and is four separate jobs, in this order:
##   init      1. INIT      set up Terraform, check required settings, configure AWS credentials,
##                          initialise the S3 backend (fails immediately if the backend is not usable)
##   validate  2. VALIDATE  terraform fmt -check -recursive, then terraform validate   (needs: init)
##   plan      3. PLAN      terraform plan -out, deletion/replacement guard, plan stored in the private state bucket
##                                                                                    (needs: validate)
##   apply     4. APPLY     apply exactly that saved plan                              (needs: plan)
## Every job runs on a fresh runner: nothing under .terraform persists between jobs, so each job that
## talks to Terraform state (init, plan, apply) sets up Terraform and initialises the same S3 backend
## itself. The validate job needs no state, so it runs "init -backend=false" and has no AWS credentials.
## The saved plan is NOT a GitHub artifact (artifacts of a public repository are readable by anyone). It is
## copied to the private, encrypted, versioned state bucket under ha-ecommerce/dev/plans/<run>-<attempt>/
## (SSE-S3, TLS only, no public access, same IAM access as the state itself) and read back by the apply job,
## which verifies the commit SHA and the plan SHA-256 recorded by the plan job before applying it. It is
## deleted after a successful apply and after a plan-only run; after a failed or cancelled apply it is kept
## for recovery until the bucket lifecycle rule expires it.
## The init, validate and plan jobs check out the same commit (github.sha, fixed when the run was
## dispatched); the apply job checks out the commit recorded by the plan job.
## "apply" defaults to true, so a dispatch plans and then applies automatically. That is only
## "automatic" if the GitHub Environment "dev-apply" has NO required reviewers and NO wait timer;
## otherwise the apply job pauses for approval (see docs/runbooks/ci-cd.md). The apply job runs only
## on the deployment branch (repository variable TF_DEPLOY_BRANCH, default "master"). Plans that delete
## or replace resources fail unless "allow_deletions" is selected. Destroy is never run.
##
## AWS authentication uses static access keys (no OIDC), always read from the secrets
## AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Intended boundary between plan and apply:
##   - init and plan jobs: no GitHub Environment, so they read the REPOSITORY-level secrets (the plan identity).
##   - apply job: runs in the "dev-apply" Environment; ENVIRONMENT-level secrets with the same names
##     override the repository ones there, so the apply identity is only used by the apply job.
## This workflow does NOT verify that the Environment really holds its own keys: if it does not, GitHub
## silently uses the repository keys in the apply job. Check this in the GitHub settings.
## The offline job and the validate job never use AWS credentials.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the saved plan after the plan stage succeeds (uncheck for plan only). Pauses for approval only if the dev-apply Environment requires reviewers."
        type: boolean
        default: true
      allow_deletions:
        description: "Allow a plan that deletes or replaces resources (otherwise the plan job fails)"
        type: boolean
        default: false

permissions:
  contents: read

## Validation runs may be cancelled by newer commits; manual deployments never are.
concurrency:
  group: terraform-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  WORKING_DIRECTORY: environments/dev
  ## Must stay under the state prefix of backend.tf.example (key ha-ecommerce/dev/...): the CI IAM policy and
  ## the bucket lifecycle rule for saved plans are scoped to this prefix.
  PLAN_KEY_PREFIX: ha-ecommerce/dev/plans

jobs:
  ## Offline gate for pull requests and pushes. It never runs for deployment (workflow_dispatch) runs,
  ## which validate in the validate job below instead.
  offline-validate:
    name: Format, validate, and test (offline)
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      ## environments/dev requires Terraform >= 1.10.0 (S3 native locking in the backend example).
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          ## Matches the python3.12 Lambda runtime in modules/automation.
          python-version: "3.12"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Validate bootstrap (backend disabled)
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate environments/dev (backend disabled)
        working-directory: environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Lambda unit tests (health monitor)
        run: python -B -m unittest discover -s tests/lambda -v

      - name: Lambda unit tests (alarm logger)
        run: python -B -m unittest discover -s modules/automation/tests -v

  ## 1. INIT. Fails the run immediately if a required setting is missing or the S3 backend cannot be
  ## initialised, so validate, plan and apply never start.
  init:
    name: Init
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      ## The remote state bucket comes from the bootstrap stack. Without it, stop here instead of
      ## falling back to local state. Only the NAMES of missing settings are reported, never values.
      ## These are repository-level values: the init and plan jobs have no Environment.
      - name: 1-pre. INIT - require the backend variables and credentials
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          HAS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          DOMAIN_NAME_VAR: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID_VAR: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
        run: |
          MISSING=""
          [ -n "$STATE_BUCKET" ] || MISSING="$MISSING TF_STATE_BUCKET"
          [ -n "$STATE_REGION" ] || MISSING="$MISSING TF_STATE_REGION"
          [ -n "$AWS_REGION_VAR" ] || MISSING="$MISSING AWS_REGION"
          [ "$HAS_ACCESS_KEY_ID" = "true" ] || MISSING="$MISSING AWS_ACCESS_KEY_ID"
          [ "$HAS_SECRET_ACCESS_KEY" = "true" ] || MISSING="$MISSING AWS_SECRET_ACCESS_KEY"
          [ -n "$DOMAIN_NAME_VAR" ] || MISSING="$MISSING DOMAIN_NAME"
          [ -n "$HOSTED_ZONE_ID_VAR" ] || MISSING="$MISSING ROUTE53_HOSTED_ZONE_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required settings:${MISSING}. Apply the bootstrap stack first and configure the variables and secrets (bootstrap/README.md, docs/runbooks/ci-cd.md)."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 1a. INIT - set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      ## Plan identity: repository-level secrets. GitHub masks secret values in logs and the keys are
      ## never echoed by this workflow. Give this IAM user only what a plan needs (state access plus
      ## read access to refresh); it must not be the apply identity.
      - name: 1b. INIT - configure AWS credentials (plan keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      ## backend.tf is created at run time from the committed example; the bucket name is not committed.
      ## The .terraform directory created here is discarded with this runner; later jobs re-initialise.
      - name: 1c. INIT - initialise the S3 backend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}"

  ## 2. VALIDATE. Runs only if the init job succeeded. Neither command creates or changes any AWS
  ## resource, reads state, or needs credentials, so the backend is disabled here.
  validate:
    name: Validate
    needs: init
    if: ${{ success() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 2-pre. VALIDATE - set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      - name: 2a. VALIDATE - terraform fmt -check -recursive
        run: terraform fmt -check -recursive

      - name: 2b. VALIDATE - terraform validate
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  ## 3. PLAN. Runs only if validate (and therefore init) succeeded. Fresh runner: set up Terraform and
  ## initialise the same S3 backend again.
  plan:
    name: Plan
    needs: validate
    if: ${{ success() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      plan_prefix: ${{ steps.meta.outputs.plan_prefix }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      plan_sha256: ${{ steps.meta.outputs.plan_sha256 }}
      build_sha256: ${{ steps.meta.outputs.build_sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 3-pre. PLAN - set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      ## Plan identity: repository-level secrets (same as the init job).
      - name: 3-pre. PLAN - configure AWS credentials (plan keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 3-pre. PLAN - initialise the S3 backend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}"

      ## A normal plan only: this workflow never uses -destroy.
      - name: 3a. PLAN - terraform plan
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          ## One region for everything: the provider region (aws_region) comes from the same AWS_REGION
          ## variable as the credentials step. The init job guarantees it is set. The origin verification
          ## secret is generated by Terraform (random_password) and never passed in from CI.
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          ## Pins the GitHub OIDC deploy role to this repository (the value comes from the run, not from code).
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_route53_hosted_zone_id: ${{ vars.ROUTE53_HOSTED_ZONE_ID }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan > /dev/null

      ## Only resource addresses and actions are printed. Plan values (which can include the
      ## origin secret and other sensitive data) are never written to the log.
      - name: 3b. PLAN - summarise (addresses and actions only)
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          {
            echo "### Terraform plan (commit ${GITHUB_SHA})"
            echo
            echo '```'
            terraform show -json tfplan | jq -r '
              .resource_changes[]
              | select(.change.actions != ["no-op"])
              | "\(.change.actions | join(",")) \(.address)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      ## Deleting or replacing resources (including the database) needs an explicit opt-in.
      - name: 3c. PLAN - block deletions and replacements unless allowed
        if: ${{ !inputs.allow_deletions }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          DELETIONS="$(terraform show -json tfplan | jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length')"
          if [ "$DELETIONS" -gt 0 ]; then
            echo "::error::The plan deletes or replaces ${DELETIONS} resource(s). Review the job summary and re-run with allow_deletions if intended."
            exit 1
          fi

      ## The Lambda packages (modules/automation/build/*.zip) are written by the archive_file data sources while
      ## the plan runs, and the saved plan refers to them by path and hash. The apply job runs on a fresh runner
      ## that never ran the plan, so it would not have them (Terraform does not re-read data sources when it
      ## applies a saved plan). They are therefore checked here and shipped to the apply job as one tar file
      ## with their own SHA-256, so the bytes applied are exactly the bytes that were planned.
      ## The saved plan can contain secrets, so it goes only to the private state bucket, never to a GitHub
      ## artifact, and is never printed. Each object is uploaded with SSE-S3 requested explicitly and the
      ## stored encryption is read back, so a bucket that does not encrypt it fails the run. The commit SHA
      ## and plan SHA-256 are recorded in plan-meta.txt and in this job's (non-secret) outputs.
      - name: 3d. PLAN - store the plan in the private state bucket and record metadata
        id: meta
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
          PLAN_PREFIX: ${{ env.PLAN_KEY_PREFIX }}/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - ../../modules/automation/build <<'PY'
          import pathlib
          import sys
          import zipfile

          build = pathlib.Path(sys.argv[1])
          handlers = {"alarm_logger.zip": "alarm_logger.py", "health_monitor.zip": "health_monitor.py"}


          def fail(message):
              print("::error::" + message)
              sys.exit(1)


          found = sorted(p.name for p in build.glob("*.zip"))
          if "alarm_logger.zip" not in found:
              fail("modules/automation/build/alarm_logger.zip was not produced by the plan.")
          for name in found:
              if (build / name).stat().st_size == 0:
                  fail(name + " is empty.")
              if name in handlers:
                  with zipfile.ZipFile(build / name) as archive:
                      if handlers[name] not in archive.namelist():
                          fail(name + " does not contain " + handlers[name] + ".")
          print("Lambda packages OK: " + ", ".join(found))
          PY
          tar -C ../.. -cf lambda-builds.tar modules/automation/build
          BUILD_SHA256="$(sha256sum lambda-builds.tar | cut -d' ' -f1)"
          PLAN_SHA256="$(sha256sum tfplan | cut -d' ' -f1)"
          COMMIT_SHA="$(git rev-parse HEAD)"
          printf 'commit_sha=%s\nplan_sha256=%s\nbuild_sha256=%s\n' "$COMMIT_SHA" "$PLAN_SHA256" "$BUILD_SHA256" > plan-meta.txt
          for FILE in tfplan plan-meta.txt lambda-builds.tar; do
            aws s3 cp "$FILE" "s3://${STATE_BUCKET}/${PLAN_PREFIX}/${FILE}" \
              --region "$STATE_REGION" --sse AES256 --only-show-errors
            SSE="$(aws s3api head-object --bucket "$STATE_BUCKET" --key "${PLAN_PREFIX}/${FILE}" \
              --region "$STATE_REGION" --query ServerSideEncryption --output text)"
            if [ "$SSE" != "AES256" ]; then
              echo "::error::The stored plan object is not server-side encrypted (got '${SSE}'). Stopping before the plan is used."
              exit 1
            fi
          done
          echo "plan_prefix=${PLAN_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=${PLAN_SHA256}" >> "$GITHUB_OUTPUT"
          echo "build_sha256=${BUILD_SHA256}" >> "$GITHUB_OUTPUT"
          rm -f tfplan plan-meta.txt lambda-builds.tar

      ## Makes a skipped apply visible instead of a silently green plan-only run. When the apply stage will not
      ## run (plan only, or not the deployment branch) nothing will ever read the stored plan, so it is removed
      ## here, after it was stored and verified. If the apply stage will run, the apply job removes it itself.
      - name: 3e. PLAN - state whether the apply stage will run
        env:
          APPLY_INPUT: ${{ inputs.apply }}
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_BRANCH: ${{ vars.TF_DEPLOY_BRANCH || 'master' }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
          PLAN_PREFIX: ${{ steps.meta.outputs.plan_prefix }}
        run: |
          if [ "$APPLY_INPUT" = "true" ] && [ "$REF_NAME" = "$DEPLOY_BRANCH" ]; then
            echo "::notice::the apply stage will run next (it waits for approval only if the dev-apply Environment requires reviewers)."
            exit 0
          fi
          if [ "$APPLY_INPUT" != "true" ]; then
            echo "::notice::apply was not selected: this run planned only."
          else
            echo "::notice::branch '${REF_NAME}' is not the deployment branch '${DEPLOY_BRANCH}': the apply stage will be skipped."
          fi
          case "$PLAN_PREFIX" in
            ha-ecommerce/dev/plans/?*) ;;
            *) echo "::error::Unexpected plan prefix; not deleting anything."; exit 1 ;;
          esac
          aws s3 rm "s3://${STATE_BUCKET}/${PLAN_PREFIX}/" --recursive --region "$STATE_REGION" --only-show-errors \
            || echo "::warning::Could not remove the stored plan; the bucket lifecycle rule will expire it."

  ## 4. APPLY. Runs only if init, validate and plan all succeeded (plan needs validate, which needs
  ## init), "apply" is selected and the run is on the deployment branch. It never creates a plan.
  apply:
    name: Apply saved plan
    needs: plan
    ## Only on the deployment branch (repository variable TF_DEPLOY_BRANCH, default master), only when
    ## "apply" is selected, and only after the plan job succeeded: if init, validate or plan fails, is
    ## cancelled or is skipped, this job is skipped.
    if: ${{ success() && needs.plan.result == 'success' && inputs.apply && github.ref_name == (vars.TF_DEPLOY_BRANCH || 'master') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    ## The "dev-apply" Environment is meant to hold the apply identity's AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    ## as ENVIRONMENT secrets. For automatic apply it must have NO required reviewers and NO wait timer (these
    ## are GitHub settings, not workflow code); restrict its deployment branches to the deployment branch.
    environment: dev-apply
    permissions:
      contents: read
    steps:
      ## Same commit that produced the plan, not the branch tip at approval time.
      - name: Check out the planned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_SHA: ${{ needs.plan.outputs.commit_sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Checked-out commit does not match the planned commit." >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false

      ## Apply identity: the dev-apply ENVIRONMENT secrets (same names as the repository secrets, which
      ## they override inside this job). If the Environment has no secrets of its own, GitHub silently
      ## falls back to the repository (plan) keys, which defeats the separation, and this workflow
      ## cannot detect that: confirm in the GitHub settings that they are set.
      - name: 4-pre. APPLY - configure AWS credentials (apply keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      ## Reads back exactly the plan this run stored and refuses to continue unless both the recorded commit
      ## and the SHA-256 of the downloaded file match the plan job's outputs.
      - name: Download and verify the reviewed plan
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
          PLAN_PREFIX: ${{ needs.plan.outputs.plan_prefix }}
          EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          EXPECTED_BUILD_SHA256: ${{ needs.plan.outputs.build_sha256 }}
          EXPECTED_SHA: ${{ needs.plan.outputs.commit_sha }}
        run: |
          case "$PLAN_PREFIX" in
            ha-ecommerce/dev/plans/?*) ;;
            *) echo "Unexpected plan prefix." >&2; exit 1 ;;
          esac
          mkdir -p plan-download
          aws s3 cp "s3://${STATE_BUCKET}/${PLAN_PREFIX}/plan-meta.txt" plan-download/plan-meta.txt --region "$STATE_REGION" --only-show-errors
          aws s3 cp "s3://${STATE_BUCKET}/${PLAN_PREFIX}/tfplan" plan-download/tfplan --region "$STATE_REGION" --only-show-errors
          aws s3 cp "s3://${STATE_BUCKET}/${PLAN_PREFIX}/lambda-builds.tar" plan-download/lambda-builds.tar --region "$STATE_REGION" --only-show-errors
          grep -qx "commit_sha=${EXPECTED_SHA}" plan-download/plan-meta.txt
          grep -qx "plan_sha256=${EXPECTED_PLAN_SHA256}" plan-download/plan-meta.txt
          grep -qx "build_sha256=${EXPECTED_BUILD_SHA256}" plan-download/plan-meta.txt
          ACTUAL_PLAN_SHA256="$(sha256sum plan-download/tfplan | cut -d' ' -f1)"
          if [ "$ACTUAL_PLAN_SHA256" != "$EXPECTED_PLAN_SHA256" ]; then
            echo "Plan checksum does not match the reviewed plan." >&2
            exit 1
          fi
          ACTUAL_BUILD_SHA256="$(sha256sum plan-download/lambda-builds.tar | cut -d' ' -f1)"
          if [ "$ACTUAL_BUILD_SHA256" != "$EXPECTED_BUILD_SHA256" ]; then
            echo "Lambda package checksum does not match the planned packages." >&2
            exit 1
          fi
          ## Only the build directory and .zip files directly inside it may be extracted (no other paths).
          if tar -tf plan-download/lambda-builds.tar | grep -qvE '^modules/automation/build/([A-Za-z0-9_.-]+\.zip)?$'; then
            echo "Unexpected entries in the Lambda package archive." >&2
            exit 1
          fi
          ## The saved plan refers to these files by path and hash; restore them where the plan expects them.
          tar -xf plan-download/lambda-builds.tar -C .
          mv plan-download/tfplan "${WORKING_DIRECTORY}/tfplan"

      ## Fresh runner: initialise the same S3 backend again. This does not create a plan.
      - name: 4-pre. APPLY - initialise the S3 backend
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          cp backend.tf.example backend.tf
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=${STATE_REGION}"

      ## Applying the saved plan applies exactly what was reviewed; Terraform rejects it if the
      ## state changed since the plan was made. No variables are needed with a saved plan.
      - name: 4. APPLY - Terraform auto-approve
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m tfplan

      ## Only after a successful apply. If the apply failed or the run was cancelled, the stored plan is kept
      ## so the failed job can be re-run; the bucket lifecycle rule expires it. (Versioning keeps the deleted
      ## object as a noncurrent version until that rule expires it too.)
      - name: Remove the stored plan after a successful apply
        if: success()
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          STATE_REGION: ${{ vars.TF_STATE_REGION }}
          PLAN_PREFIX: ${{ needs.plan.outputs.plan_prefix }}
        run: |
          case "$PLAN_PREFIX" in
            ha-ecommerce/dev/plans/?*) ;;
            *) echo "::error::Unexpected plan prefix; not deleting anything."; exit 1 ;;
          esac
          aws s3 rm "s3://${STATE_BUCKET}/${PLAN_PREFIX}/" --recursive --region "$STATE_REGION" --only-show-errors \
            || echo "::warning::Could not remove the stored plan; the bucket lifecycle rule will expire it."

      - name: Remove local plan files
        if: always()
        run: rm -rf plan-download "${WORKING_DIRECTORY}/tfplan"
